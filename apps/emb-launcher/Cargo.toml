[package]
name = "emb-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
# The update check's HTTPS GET (rustls: pure-Rust TLS, no system openssl, so
# the launcher cross-compiles to Linux/Arch from a Windows box; the launcher
# is the only consumer).
ureq = { version = "2", default-features = false, features = ["tls"] }
