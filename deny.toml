# Dependency licence policy. See LICENCE.md — this file is the enforcement, that
# document is the reasoning.
#
# The Rust workspace is MIT. A permissive dependency is compatible with that but
# imposes attribution on a distributed binary; a copyleft one arriving
# transitively through a `Cargo.lock` update is silent and expensive. That is why this is
# a gate and not a habit.

[graph]
all-features = true

[licenses]
version = 2
# Permissive only. Anything not listed stops the build rather than being waved through.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

# MPL-2.0 is deliberately absent from `allow`. Its copyleft is per-file and linking is
# permitted, so it is usually fine — but "usually" is not a policy. It stops the build
# until somebody rules on that specific dependency, and the ruling goes in docs/decisions/INDEX.md.

# Our own crates carry `MIT`, which is on the `allow` list above. They are still
# skipped here by being UNPUBLISHED, derived from `publish = false` in each
# manifest — not by an exception list. A list would need a line per crate and would
# be wrong the day one is added, with nothing able to notice.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
