[workspace]
resolver = "3"
members = [
    "crates/emb-data",
    "crates/emb-model",
    "crates/emb-draw",
    "crates/emb-egui",
    "apps/emb-editor",
    "apps/emb-viewer",
    "apps/emb-converter",
    "apps/emb-launcher",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# unsafe_code = "forbid" is declared per-crate (docs/decisions/D001.md).
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Shrinks the release exes (~13 MB each → ~7 MB, measured 2026-08-17 with
# thin LTO; strip = "symbols" removes debug symbols; panic = "abort" drops the
# unwind tables). The apps are eframe statics — the size is the shared UI
# stack, not app code.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[patch.crates-io]
eframe = { path = "tools/vendor/eframe" }
